{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Supervya</title>
  <link rel="stylesheet" href="{% static 'css/supervya.css' %}">
</head>
<body>
  <main class="panel auth-card">
    <h1>Supervya</h1>
    <p class="lead">Supervision d'infrastructures — connexion sécurisée.</p>
    {% if form.errors %}
      <ul class="messages"><li class="error">Identifiant ou mot de passe incorrect.</li></ul>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {% for field in form %}
      <p>
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
      </p>
      {% endfor %}
      <button type="submit">Se connecter</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </main>
</body>
</html>
