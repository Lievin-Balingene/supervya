name: supervya

services:
  postgres-zabbix:
    image: postgres:16-alpine
    container_name: supervya-postgres-zabbix
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
    volumes:
      - zabbix_pgdata:/var/lib/postgresql/data
    networks:
      - supervya-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZABBIX_DB_USER:-zabbix} -d ${ZABBIX_DB_NAME:-zabbix}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres-supervya:
    image: postgres:16-alpine
    container_name: supervya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SUPERVYA_DB_USER:-supervya}
      POSTGRES_PASSWORD: ${SUPERVYA_DB_PASSWORD:-supervya}
      POSTGRES_DB: ${SUPERVYA_DB_NAME:-supervya}
    volumes:
      - supervya_pgdata:/var/lib/postgresql/data
    networks:
      - supervya-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERVYA_DB_USER:-supervya} -d ${SUPERVYA_DB_NAME:-supervya}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: supervya-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - supervya-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: supervya-zabbix-server
    restart: unless-stopped
    depends_on:
      postgres-zabbix:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: postgres-zabbix
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      ZBX_CACHESIZE: 128M
      ZBX_STARTPOLLERS: 5
      ZBX_STARTTRAPPERS: 5
      ZBX_STARTPINGERS: 1
      ZBX_STARTDISCOVERERS: 1
      ZBX_STARTVMWARECOLLECTORS: 0
    ports:
      # Port d'écoute des agents actifs (ServerActive côté client)
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    volumes:
      - zabbix_server_alertscripts:/usr/lib/zabbix/alertscripts
      - zabbix_server_externalscripts:/usr/lib/zabbix/externalscripts
    networks:
      - supervya-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: supervya-zabbix-web
    restart: unless-stopped
    depends_on:
      postgres-zabbix:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      DB_SERVER_HOST: postgres-zabbix
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      PHP_TZ: ${TZ:-Europe/Paris}
    # Réservé à l'administrateur interne : écoute uniquement sur localhost
    ports:
      - "127.0.0.1:${ZABBIX_WEB_PORT:-8080}:8080"
    networks:
      - supervya-net

  web:
    build: .
    container_name: supervya-web
    restart: unless-stopped
    depends_on:
      postgres-supervya:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SUPERVYA_DB_HOST: postgres-supervya
      DATABASE_URL: postgres://${SUPERVYA_DB_USER:-supervya}:${SUPERVYA_DB_PASSWORD:-supervya}@postgres-supervya:5432/${SUPERVYA_DB_NAME:-supervya}
      REDIS_URL: redis://redis:6379/0
      ZABBIX_API_URL: http://zabbix-web:8080/api_jsonrpc.php
    ports:
      - "${SUPERVYA_WEB_PORT:-8000}:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn supervya.wsgi:application --bind 0.0.0.0:8000 --reload"
    volumes:
      - .:/app
    networks:
      - supervya-net

volumes:
  zabbix_pgdata:
  supervya_pgdata:
  redis_data:
  zabbix_server_alertscripts:
  zabbix_server_externalscripts:

networks:
  supervya-net:
    name: supervya-net
    driver: bridge
